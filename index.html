<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adolat Fashion | Atelye</title>
    
    <link rel="icon" type="image/jpeg" href="1000064443.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #B8860B;
            --white: #FFFFFF;
            --bg: #FAFAFA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(var(--gold) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
        }

        .card {
            background: var(--white);
            width: 90%;
            max-width: 400px;
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            border: 2px solid var(--gold);
            position: relative;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            padding: 3px;
            background: white;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-gold);
            margin: 0 0 10px 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .line {
            width: 50px;
            height: 2px;
            background: var(--gold);
            margin: 10px auto 20px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-insta { background: var(--white); color: #E1306C; border-color: #E1306C; }
        .btn-tg { background: var(--white); color: #0088cc; border-color: #0088cc; }
        .btn-call { background: var(--gold); color: white; border-color: var(--gold); }
        .btn-map { background: #333; color: white; border-color: #333; }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .thread {
            position: absolute;
            top: -10px;
            right: 20px;
            font-size: 30px;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="thread">🧵</div>
        
        <div class="logo-container">
            <img src="1000064443.jpg" alt="Adolat Fashion Logo" class="logo-img">
        </div>

        <h1>Adolat Fashion</h1>
        <div class="line"></div>
        <p>Siz orzu qilgan liboslarni oltin choklar bilan haqiqatga aylantiramiz. Har bir mijozimiz biz uchun qadrli.</p>

        <div class="links">
            <a href="https://www.instagram.com/adolat_fashion" class="btn btn-insta" >
                <span>Instagram</span>
            </a>
            
            <a href="https://t.me/Adolat_dsgn" class="btn btn-tg" >
                <span>Telegram Kanal</span>
            </a>
            
            <a href="tel:+998941121989" class="btn btn-call">
                <span>Telefon Qilish</span>
            </a>
            
            <a href="https://maps.google.com" class="btn btn-map" >
                <span>Manzilimiz (Xarita)</span>
            </a>
        </div>
        
        <div style="margin-top: 30px; font-size: 10px; color: var(--gold); opacity: 0.5;">
            Siz orzu qilgan barcha libos biz bilan ro'yobdir
        </div>
    </div>

</body>
</html>
